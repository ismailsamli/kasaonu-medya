<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), p=(t,a,d)=>cl((t-a)/d);
const io=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, oc=x=>1-Math.pow(1-x,3);
const ob=x=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const L=(a,b,k)=>a+(b-a)*k, st=t=>Math.floor(t*12)/12, R=Math.PI/180;
const tr=(id,s)=>$(id).setAttribute('transform',s);
const op=(id,v)=>{$(id).style.opacity=v};
// kanca yazısı 900px'e sığsın
let FIT=false;function fit(){if(FIT||!document.fonts.check('700 100px "Space Grotesk"'))return;FIT=true;document.querySelectorAll('#hook .hw').forEach(w=>{w.style.whiteSpace='nowrap';w.style.display='inline-block';let f=parseFloat(w.style.fontSize);while(w.offsetWidth>900&&f>60){f-=2;w.style.fontSize=f+'px'}w.style.display='block'})}

const B={"q": 0.3, "start": 1.95, "sabah": 3.36, "kapi": 4.65, "bilmiyor": 6.71, "grup": 7.69, "kirk": 10.42, "sofor": 12.24, "aksam": 15.56, "bindi": 17.15, "emin": 18.51, "vg": 19.73, "harita": 21.93, "eta": 23.93, "bildirim": 25.65, "gitmeyecek": 29.19, "beklemez": 32.4, "sefer": 34.31, "panel": 36.45, "gonder": 41.41, "cunku": 45.12, "son": 47.53, "END": 49.448}; const END=B.END;

 [B.kirk+.1,'ticks'],[B.kirk+.6,'pop'],[B.kirk+1.1,'pop'],[B.sofor+.1,'whoosh'],[B.sofor+.6,'ticks'],[B.aksam+.1,'whoosh'],[B.bindi+.1,'pop'],[B.bindi+.6,'pop'],[B.emin,'thud'],
 [B.vg+.1,'whoosh'],[B.vg+.5,'pop'],[B.harita+.1,'whoosh'],[B.eta+.1,'pop'],[B.bildirim+.1,'whoosh'],[B.bildirim+.5,'pop'],[B.gitmeyecek+.1,'whoosh'],[B.gitmeyecek+.9,'pop'],

const LINES=[[B.start,B.sabah-.1,'Bildiğini<br><span class="o">sanıyorsun.</span>'],[B.sabah,B.kapi-.1,'Sabah<br><span class="o">07:30.</span>'],
 [B.kapi,B.bilmiyor-.1,'Kapıda mı?<br><span class="o">Köşede mi?</span>'],[B.bilmiyor,B.grup-.1,'<span class="o">Bilmiyorsun.</span>'],
 [B.grup,B.kirk-.1,'Veli grubu:<br><span class="o">"Servis nerede?"</span>'],[B.kirk,B.sofor-.1,'Kırk kişi,<br><span class="o">aynı soru.</span>'],
 [B.sofor,B.aksam-.1,'Şoför: direksiyon<br><span class="o">+ telefon.</span>'],[B.aksam,B.bindi-.1,'Akşam çocuk<br><span class="o">geç geliyor.</span>'],
 [B.bindi,B.emin-.1,'Bindi mi?<br><span class="o">İndi mi?</span>'],[B.emin,B.vg-.1,'Kimse<br><span class="o">emin değil.</span>'],
 [B.vg,B.harita-.1,'Tam bunun için:'],[B.harita,B.bildirim-.1,'Servis haritada,<br><span class="o">canlı.</span>'],
 [B.bildirim,B.gitmeyecek-.1,'"Araca bindi"<br><span class="o">bildirimi.</span>'],[B.gitmeyecek,B.sefer-.1,'Gitmeyecek mi?<br><span class="o">Tek dokunuş.</span>'],
 [B.sefer,B.panel-.1,'Şoför seferi<br><span class="o">tek tuşla açar.</span>'],[B.panel,B.gonder-.1,'Firma her şeyi<br><span class="o">tek panelden.</span>'],
 [B.gonder,B.son-.1,'Bu videoyu<br><span class="o">servisçine gönder.</span>'],[B.son,END-.45,'Çocuğun şu an<br><span class="o">nerede?</span>']];
const BIG=[[B.emin-.1,B.vg-.1]], HITS=[0.02,B.emin,B.gonder+.6];
const MS=['Servis nerede?','Servis nerede?','Bizimki de bekliyor','Geçti mi?','Servis nerede??','Arayan var mı?','Hâlâ gelmedi','Servis nerede?','Şoföre ulaşan?','Biz de bekliyoruz','Nerede kaldı?','Servis nerede?','Haber yok mu?','Servis nerede?'];
$('bub').innerHTML=MS.map((m,i)=>{const me=i===0, w=Math.min(500,m.length*17+50), x=me?250-w:-260;
 return `<g id="m${i}"><rect x="${x}" y="${-270+i*86}" width="${w}" height="70" rx="20" fill="${me?'#ff5a1f':'#e3ded2'}"/><text x="${x+24}" y="${-224+i*86}" font-size="28" fill="${me?'#FFF8EB':'#1c1b18'}">${m}</text></g>`}).join('');
const TL=['ARAÇLAR','ÖĞRENCİLER','SEFERLER'];
$('tiles').innerHTML=TL.map((a,i)=>`<g id="tl${i}" transform="translate(0 ${-110+i*92})"><rect x="-290" y="-36" width="580" height="74" rx="12" fill="#fff" stroke="#e3ded2" stroke-width="3"/><rect x="-270" y="-20" width="42" height="42" rx="8" fill="#124a85"/><text x="-210" y="12" font-size="32" fill="#1c1b18">${a}</text><path id="tc${i}" d="M218 0 l16 16 l34 -36" stroke="#8A9B7C" stroke-width="10" fill="none" stroke-linecap="round"/></g>`).join('');
function scene(t){
  const W=(a,b)=>(t<a||t>b)?0:ob(p(t,a,.35))*(1-io(p(t,b-.25,.25)));

  tr('kid',`translate(470 1150) scale(${kv})`);
  const wq=p(t,.3,.4)*(1-p(t,END-.9,.4)); tr('pinq',`translate(0 ${-300+Math.sin(t*3)*10*wq}) rotate(${Math.sin(t*2.4)*6*wq})`);
  // sabah: sokak + saat

  $('clkT').textContent=morning?'07:30':'17:45';
  const mm=morning?180+cl(t-B.sabah,0,3)*12:270+cl(t-B.aksam,0,3)*12, hh=morning?225+cl(t-B.sabah,0,3):172.5+cl(t-B.aksam,0,3);
  tr('mh',`rotate(${mm})`); tr('hh',`rotate(${hh})`);
  tr('moon',`translate(740 560) scale(${W(B.aksam,B.emin+.25)})`);
  const kp=t>=B.kapi&&t<B.grup, bl=Math.floor(t*3)%2, unk=t>=B.bilmiyor;
  tr('bA',`translate(360 1180) scale(${kp?ob(p(t,B.kapi,.3)):0})`); tr('bB',`translate(610 1180) scale(${kp?ob(p(t,B.kapi+.7,.3)):0})`);
  op('bA',unk?.3:(bl?1:.35)); op('bB',unk?.3:(bl?.35:1));
  op('qA',1); op('qB',1);
  // veli grubu
  tr('chat',`translate(470 900) scale(${W(B.grup,B.sofor+.25)})`);
  let n=0; MS.forEach((_,i)=>{const at=i===0?B.grup+1.6:B.kirk+(i-1)*.17; const on=t>=at; if(on)n++; op('m'+i,on?1:0)});
  const sc=Math.max(0,n-7)*86; $('bub').setAttribute('transform',`translate(0 ${-sc})`);
  $('cnt').textContent=t<B.kirk?(n?'1':'0'):String(Math.round(L(1,40,io(p(t,B.kirk,1.6)))));
  // şoför
  tr('drv',`translate(470 1020) scale(${W(B.sofor,B.aksam+.25)})`);
  tr('whl',`rotate(${Math.sin(t*2.2)*14} 0 90)`); op('buzz',Math.floor(t*6)%2?1:0); op('warn',Math.floor(t*3)%2&&t>B.sofor+1?1:0);
  $('dph').setAttribute('transform',`translate(190 -110) rotate(${14+Math.sin(t*40)*3*(Math.floor(t*6)%2)})`);
  // bindi mi indi mi + kimse emin değil
  tr('bq1',`translate(270 ${930}) rotate(${-6+Math.sin(t*4)*3}) scale(${W(B.bindi,B.vg+.25)})`);
  tr('bq2',`translate(670 ${1090}) rotate(${5-Math.sin(t*4)*3}) scale(${W(B.bindi+.5,B.vg+.25)})`);
  tr('ky',`translate(470 1010) rotate(-7) scale(${t>B.emin&&t<B.vg+.25?L(2,1,io(p(t,B.emin,.15)))*(1-io(p(t,B.vg,.25))):0})`);
  // Veligo
  tr('brandS',`translate(470 860) scale(${W(B.vg+.2,B.harita+.25)})`);
  const pw=t>=B.harita&&t<=B.panel+.3, pin=oc(p(t,B.harita,.45)), pout=io(p(t,B.panel,.3));
  tr('ph',`translate(470 ${L(1800,890,pin)+pout*1000})`); op('ph',pw?1:0);
  op('im1',t<B.bildirim?1:0); op('im2',t>=B.bildirim&&t<B.gitmeyecek?1:0); op('im3',t>=B.gitmeyecek&&t<B.sefer?1:0); op('im4',t>=B.sefer?1:0);
  const onMap=t<B.bildirim, rp=$('route'), rk=io(p(t,B.harita+.4,(B.bildirim-B.harita)-.6));
  op('route',onMap?.9:0); op('dot',onMap&&t>B.harita+.3?1:0);
  const pt=rp.getPointAtLength(rp.getTotalLength()*rk); tr('dot',`translate(${pt.x} ${pt.y})`);
  $('dotR').setAttribute('r',22+((t*1.5)%1)*18); $('dotR').style.opacity=.45*(1-((t*1.5)%1));
  tr('eta',`translate(0 330) scale(${t>=B.eta&&t<B.bildirim?ob(p(t,B.eta,.35)):0})`);
  tr('ntf',`translate(0 ${t>=B.bildirim+.4&&t<B.gitmeyecek?L(-560,-330,oc(p(t,B.bildirim+.4,.4))):-700})`);
  const pul=1+Math.sin(t*7)*.02;
  op('rgL',t>B.bildirim+1.2&&t<B.gitmeyecek?1:0); op('rgV',t>B.gitmeyecek+.6&&t<B.sefer?1:0); op('rgS',t>B.sefer+.6&&t<B.panel?1:0);
  ['rgL','rgV','rgS'].forEach(id=>$(id).style.transformBox='fill-box');
  ['rgL','rgV','rgS'].forEach(id=>{$(id).style.transformOrigin='center';$(id).style.transform=`scale(${pul})`});
  let tp=null; if(t>B.gitmeyecek+.8&&t<B.gitmeyecek+1.4)tp=[0,245,p(t,B.gitmeyecek+.8,.6)]; if(t>B.sefer+.8&&t<B.sefer+1.4)tp=[124,-96,p(t,B.sefer+.8,.6)];
  if(tp){tr('tap',`translate(${tp[0]} ${tp[1]}) scale(${.5+tp[2]})`);op('tap',.6*(1-tp[2]))}else op('tap',0);
  tr('okb',`translate(0 350) scale(${t>=B.beklemez&&t<B.sefer?ob(p(t,B.beklemez,.35)):0})`);
  // firma paneli
  tr('pnl',`translate(470 900) scale(${W(B.panel,B.gonder+.25)})`);
  TL.forEach((_,i)=>{const a=B.panel+1.2+i*.85; op('tl'+i,t>a-.5?1:.25); const c=$('tc'+i); c.style.strokeDasharray='80'; c.style.strokeDashoffset=80*(1-p(t,a,.3))});
  tr('tk',`translate(0 262) rotate(-4) scale(${t>B.panel+3.6?L(1.8,1,io(p(t,B.panel+3.6,.15))):0})`);
  // kapanış kartı
  tr('brand',`translate(470 900) scale(${W(B.gonder,END-1.1)})`);
  const bd=p(t,B.gonder+.6,.15); tr('bd1',`scale(${t>B.gonder+.6?L(1.4,1,io(bd)):0})`); $('bd1').style.transformBox='fill-box'; $('bd1').style.transformOrigin='center';
  op('bd2',t>B.gonder+1.2?1:0); op('bd3',t>B.gonder+1.6?1:0); op('bd4',t>B.gonder+2.0?1:0);
}

const HK=.45;
window.seek=function(t){
  fit();
  const pull=io(p(t,B.start-.1,.6)), push=io(p(t,END-HK,HK));
  let s=L(1.18,1,pull); s=L(s,1.18,push);
  $('cam').style.transform=`scale(${s})`;
  $('furn').style.opacity=pull*(1-push); $('prog').style.width=(cl(t/END)*100)+'%';
  $('floor').style.opacity=pull*(1-push);
  $('sv').style.transform=`translateY(${110*pull*(1-push)}px)`;
  const hk=$('hook'); hk.style.display=(t<B.start+.3||t>=END-HK)?'block':'none';
  hk.querySelectorAll('.hw').forEach((w,i)=>{let y=0,sc=1,o=1;
    if(t<B.start+.3){y=-6*Math.sin(t*3)*(i?1:-1)*(1-p(t,1.0,.5));sc=1-io(p(t,B.start-.2+i*.05,.3))}
    else{const k=oc(p(t,END-HK+i*.06,.33));y=(1-k)*80;o=cl(p(t,END-HK+i*.06,.1)*2)}
    w.style.transform=`translateY(${y}px) scaleY(${sc})`;w.style.transformOrigin='0 85%';w.style.opacity=o});
  scene(t,pull,push);
  const tA=$('tA'); let txt='',t0=0;for(const [a,b2,x] of LINES) if(t>=a&&t<b2){txt=x;t0=a}
  if(tA.dataset.t!==txt){tA.innerHTML=txt;tA.dataset.t=txt}
  const k2=ob(p(t,t0,.4)); tA.style.opacity=txt?cl(p(t,t0,.1)*2)*(1-p(t,END-HK-.15,.15)):0;
  tA.style.transform=`translateY(${(1-k2)*40}px) scale(${BIG.some(([a,b])=>t>=a&&t<b)?1.15:1})`;
  const sh=HITS.some(a=>t>a&&t<a+.22)?Math.sin(t*90)*7:0;
  $('rc').style.transform=`translateX(${sh}px)`;
};
seek(0);
</script></body></html>
