  const gv=W(B.sonuc,B.ilginc+.2); op('chart',gv>0?1:0); tr('chart',`translate(470 760) scale(${gv})`);
  const ha=300*io(p(t,B.sonuc+.3,.8)), hb=414*io(p(t,B.sonuc+1.0,1.2));
  $('barA').setAttribute('y',300-ha); $('barA').setAttribute('height',ha); $('barB').setAttribute('y',300-hb); $('barB').setAttribute('height',hb);
  tr('p38',`translate(0 -250) rotate(-5) scale(${t>SOK?L(1.8,1,io(p(t,SOK,.15))):0})`);
  // hatırlıyor mu
  const hv=W(B.ilginc,B.alici+.2); tr('bub',`translate(470 820) scale(${hv})`);
  tr('fe',`translate(470 1100) rotate(-4) scale(${t>B.fark?hv*L(1.8,1,io(p(t,B.fark,.15))):0})`);
  // alıcıysan
  const a2=W(B.alici,B.satici+.2); tr('tagA',`translate(470 560) scale(${a2})`);
  tr('hp',`translate(280 850) scale(${a2*.9})`); tr('lst',`translate(680 900) rotate(4) scale(${t>B.alici+1.8?a2*ob(p(t,B.alici+1.8,.35))*.9:0})`);
  // satıcıysan
  const s2=W(B.satici,B.yarin+.2); tr('tagS',`translate(470 560) scale(${s2})`); tr('vol',`translate(470 880) scale(${s2})`);
  const vk=io(p(t,B.kis+.3,1)); const vx=L(140,-100,vk); $('volF').setAttribute('width',vx+240); $('volK').setAttribute('cx',vx);
  $('volT').textContent=vk>.5?'SES: KISIK ✓':'SES: YÜKSEK';
  
  tr('yrn',`translate(470 ${t>B.takip?L(900,820,io(p(t,B.takip,.4))):900}) scale(${t>B.yarin?ob(p(t,B.yarin,.4)):0})`);
  tr('ytk',`translate(470 1150) scale(${t>B.takip?ob(p(t,B.takip,.35))*(1+Math.sin(t*6)*.02):0})`);
  const sb=$('sub'); let st='';for(const [a,b,x] of SUBS) if(t>=a&&t<b){st=x}
  if(sb.dataset.t!==st){sb.textContent=st;sb.dataset.t=st} sb.style.opacity=(st&&t>=B.start)?1:0;

}

const HK=.45;
window.seek=function(t){
  fit();
  const pull=io(p(t,B.start-.1,.6)), push=0;
  let s=L(1.18,1,pull); s=L(s,1.18,push);
  $('cam').style.transform=`scale(${s})`;
  $('furn').style.opacity=pull*(1-push); $('prog').style.width=(cl(t/END)*100)+'%';
  $('floor').style.opacity=pull*(1-push);
  $('sv').style.transform=`translateY(${110*pull*(1-push)}px)`;
  const hk=$('hook'); hk.style.display=(t<B.start+.3)?'block':'none';
  hk.querySelectorAll('.hw').forEach((w,i)=>{let y=0,sc=1,o=1;
    if(t<B.start+.3){y=-6*Math.sin(t*3)*(i?1:-1)*(1-p(t,1.0,.5));sc=1-io(p(t,B.start-.2+i*.05,.3))}
    else{const k=oc(p(t,END-HK+i*.06,.33));y=(1-k)*80;o=cl(p(t,END-HK+i*.06,.1)*2)}
    w.style.transform=`translateY(${y}px) scaleY(${sc})`;w.style.transformOrigin='0 85%';w.style.opacity=o});
  scene(t,pull,push);
  const tA=$('tA'); let txt='',t0=0;for(const [a,b2,x] of LINES) if(t>=a&&t<b2){txt=x;t0=a}
  if(tA.dataset.t!==txt){tA.innerHTML=txt;tA.dataset.t=txt}
  const k2=ob(p(t,t0,.4)); tA.style.opacity=txt?cl(p(t,t0,.1)*2):0;
  tA.style.transform=`translateY(${(1-k2)*40}px) scale(${BIG.some(([a,b])=>t>=a&&t<b)?1.15:1})`;
  const sh=HITS.some(a=>t>a&&t<a+.22)?Math.sin(t*90)*7:0;
  $('rc').style.transform=`translateX(${sh}px)`;
};
seek(0);
