  // tankerler
  op('tks',t>B.su&&t<B.deniz+.25?1-io(p(t,B.deniz,.25)):0);
  for(let i=0;i<65;i++){const a=B.su+.25+i*.025, k=oc(p(t,a,.3)); const el=$('t'+i); el.style.opacity=t>a?1:0; el.setAttribute('transform',`translate(${+el.dataset.x-(1-k)*120} ${el.dataset.y})`)}
  // kıyı
  const sh=W(B.deniz,B.hamsi+.35); op('shore',sh>0?cl(p(t,B.deniz,.25))*(1-io(p(t,B.hamsi+.1,.25))):0);
  $('shore').style.transform=`translateY(${(1-oc(p(t,B.deniz,.4)))*80}px)`;
  const fk=p(t,B.deniz+.6,.35); tr('foot',`translate(470 ${L(420,900,fk*fk)}) scale(${t>B.deniz+.5&&t<B.hamsi+.2?.75*(1-io(p(t,B.hamsi,.2))):0})`);
  // hamsi: su yükselir
  const dk2=t<B.hamsi?0:io(p(t,B.hamsi,.5))*(1-io(p(t,B.dur,.3)));
  $('deepR').setAttribute('y',L(1262,540,dk2)); $('deepR').setAttribute('height',L(0,722,dk2));
  op('fish',t>B.hamsi+.2&&t<B.dur+.3?cl(p(t,B.hamsi+.2,.3))*(1-io(p(t,B.dur,.3))):0); op('kg3',dk2>.5?(dk2-.5)*2:0);
  for(let i=0;i<36;i++){const el=$('fi'+i), x=+el.dataset.x+((t*60+i*37)%160)-80, y=+el.dataset.y+Math.sin(t*4+i)*8; el.setAttribute('transform',`translate(${x} ${y})`)}
  // fiş
  const fw2=t<B.dur||t>B.yani+.25?0:1; const fsk=oc(p(t,B.dur,.45)), fo=io(p(t,B.yani,.3));
  tr('fs',`translate(470 ${L(1700,1230,fsk)+fo*900})`); op('fs',fw2);
  ITEMS.forEach((_,i)=>op('it'+i,t>B.dur+.3+i*.1?1:0));
  const dd=p(t,B.borc+.3,.15); tr('debt',`translate(0 -100) scale(${t>B.borc+.3?L(1.6,1,io(dd)):0}) translate(0 100)`);
  // sütunlar
  const bon=t>B.yani&&t<B.at+.25, bo=1-io(p(t,B.at,.25));
  tr('bars',`translate(0 0)`); op('bars',bon?bo:0);
  tr('bg',`translate(290 ${FY-60}) scale(1 ${ob(p(t,B.yani+.2,.4))})`); op('bgT',1);
  $('bgT').setAttribute('transform',`translate(290 ${FY-60})`); $('bdT').setAttribute('transform',`translate(650 ${FY-60})`);
  for(let i=0;i<6;i++){const a=B.yani+.5+i*.18, k=p(t,a,.25); tr('bd'+i,`translate(650 ${FY-60-(1-k*k)*500})`); op('bd'+i,t>a?1:0)}
  op('bdT',t>B.yani+1.4?1:0);
  // uçak
  const pk2=io(p(t,B.at+.2,1.6)), pon=t>B.at&&t<B.simdi+.4;
  const P=(k)=>[L(120,840,k), L(1150,560,k)-Math.sin(k*Math.PI)*260];
  const [px,py]=P(pk2), [qx,qy]=P(Math.min(1,pk2+.02));
  tr('plane',`translate(${px} ${py}) rotate(${Math.atan2(qy-py,qx-px)/R+20}) scale(${pon?ob(p(t,B.at,.3))*(1-io(p(t,B.simdi+.1,.3))):0})`);
  let d='';for(let k=0;k<=pk2;k+=.02){const [x,y]=P(k);d+=(d?' L':'M')+x.toFixed(1)+' '+y.toFixed(1)}
  $('trail').setAttribute('d',pon?d:''); op('trail',pon?1-io(p(t,B.simdi,.4)):0);
}

const HK=.45;
window.seek=function(t){
  fit();
  const pull=io(p(t,B.start-.1,.6)), push=io(p(t,END-HK,HK));
  let s=L(1.18,1,pull); s=L(s,1.18,push);
  $('cam').style.transform=`scale(${s})`;
  $('furn').style.opacity=pull*(1-push); $('prog').style.width=(cl(t/END)*100)+'%';
  $('floor').style.opacity=pull*(1-push);
  $('sv').style.transform=`translateY(${110*pull*(1-push)}px)`;
  const hk=$('hook'); hk.style.display=(t<B.start+.3||t>=END-HK)?'block':'none';
  hk.querySelectorAll('.hw').forEach((w,i)=>{let y=0,sc=1,o=1;
    if(t<B.start+.3){y=-6*Math.sin(t*3)*(i?1:-1)*(1-p(t,1.0,.5));sc=1-io(p(t,B.start-.2+i*.05,.3))}
    else{const k=oc(p(t,END-HK+i*.06,.33));y=(1-k)*80;o=cl(p(t,END-HK+i*.06,.1)*2)}
    w.style.transform=`translateY(${y}px) scaleY(${sc})`;w.style.transformOrigin='0 85%';w.style.opacity=o});
  scene(t,pull,push);
  const tA=$('tA'); let txt='',t0=0;for(const [a,b2,x] of LINES) if(t>=a&&t<b2){txt=x;t0=a}
  if(tA.dataset.t!==txt){tA.innerHTML=txt;tA.dataset.t=txt}
  const k2=ob(p(t,t0,.4)); tA.style.opacity=txt?cl(p(t,t0,.1)*2)*(1-p(t,END-HK-.15,.15)):0;
  tA.style.transform=`translateY(${(1-k2)*40}px) scale(${BIG.some(([a,b])=>t>=a&&t<b)?1.15:1})`;
  const sh=HITS.some(a=>t>a&&t<a+.22)?Math.sin(t*90)*7:0;
  $('rc').style.transform=`translateX(${sh}px)`;
};
seek(0);
</script></body></html>
