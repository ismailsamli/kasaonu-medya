<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../fonts/space-grotesk/700.css"><link rel="stylesheet" href="../../fonts/space-mono/700.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#201f1b}
#cam{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 900px}
#rc{position:absolute;left:70px;top:150px;width:940px;height:1620px;background:#f3efe4;filter:drop-shadow(0 14px 18px rgba(0,0,0,.45))}
.mono{font-family:"Space Mono";font-weight:700}
.gk{font-family:"Space Grotesk";font-weight:700;color:#1c1b18;letter-spacing:-3px;line-height:.95}
.o{color:#ff5a1f}
.abs{position:absolute}
svg{position:absolute;left:0;top:0;overflow:visible}
</style></head><body>
<div id="cam">
 <div id="rc">
  <div id="furn">
   <div class="abs mono" style="left:0;right:0;top:40px;text-align:center;font-size:30px;letter-spacing:8px;color:#1c1b18">✻ KASA ÖNÜ ✻</div>
   <div class="abs" style="left:60px;right:60px;top:96px;border-top:4px dashed #b9b4a8"></div>
   <div class="abs mono" style="left:60px;top:116px;font-size:26px;color:#1c1b18">BABAM · 01</div>
   <div class="abs mono" style="right:60px;top:116px;font-size:26px;color:#8c8880">FİŞ 0002</div>
   <div class="abs" style="left:60px;right:60px;top:160px;height:6px;background:#e3ded2"><div id="prog" style="height:6px;background:#ff5a1f;width:0"></div></div>
   <div class="abs mono" style="left:60px;right:60px;bottom:50px;font-size:24px;color:#8c8880;display:flex"><span>GALERİ</span><span style="flex:1;border-bottom:3px dotted #b9b4a8;margin:0 14px 8px"></span><span>PAZARLIK</span></div>
  </div>
  <svg id="sv" width="940" height="1620" viewBox="0 0 940 1620">
   <defs><filter id="ps" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="6" dy="9" stdDeviation="5" flood-color="#243139" flood-opacity=".28"/></filter></defs>
   <!-- chart (ink line) -->
   <g id="chart">
     <path id="cl" d="M120 560 L330 560 L330 680 L560 680 L560 800 L820 800" fill="none" stroke="#1c1b18" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
     <circle id="tip" r="15" fill="#ff5a1f"/>
   </g>
   <!-- paper scene -->
   <g id="scene" filter="url(#ps)">
     <g id="ground"><path d="M-20 1290 L960 1290 L960 1330 L-20 1330 Z" fill="#c9c2b2"/></g>
     <g id="banner"><path d="M250 340 L690 336 L694 420 L246 424 Z" fill="#7C9DA5"/><text x="470" y="398" text-anchor="middle" font-family="Space Mono" font-weight="700" font-size="46" fill="#FFF8EB" letter-spacing="10">GALERİ</text>
       <path d="M240 330 L700 326 L700 340 L240 344Z" fill="#243139"/></g>
     <g id="car">
       <path d="M150 1150 L210 1060 L330 1010 L560 1008 L680 1070 L800 1090 L812 1190 L140 1196 Z" fill="#ff5a1f"/>
       <path d="M240 1068 L330 1028 L440 1026 L440 1074 Z" fill="#cfe1e6"/><path d="M462 1026 L548 1028 L640 1074 L462 1076 Z" fill="#cfe1e6"/>
       <path d="M150 1150 L812 1146 L812 1162 L148 1166Z" fill="#c4461a"/>
       <g class="wh" transform="translate(280 1200)"><circle r="62" fill="#243139"/><circle r="26" fill="#d9d3c4"/></g>
       <g class="wh" transform="translate(690 1200)"><circle r="62" fill="#243139"/><circle r="26" fill="#d9d3c4"/></g>
       <g id="tag" transform="translate(540 960)"><path d="M0 -10 V-60" stroke="#1c1b18" stroke-width="4"/><g id="tagIn"><path d="M-70 -10 H70 V60 H-70Z" fill="#FFF8EB"/><text x="0" y="36" text-anchor="middle" font-family="Space Mono" font-weight="700" font-size="30" fill="#1c1b18">SATILIK</text></g></g>
     </g>
     <!-- people: baba (cap), oğul, galerici -->
     <g id="baba"><g class="body">
       <path d="M-46 0 L-40 -150 Q0 -176 40 -150 L46 0 Z" fill="#7C9DA5"/>
       <circle cy="-196" r="44" fill="#e9c9a6"/>
       <path d="M-50 -214 Q0 -262 50 -214 L66 -208 L-50 -204Z" fill="#8c8880"/>
       <path d="M-22 -180 Q0 -168 22 -180" stroke="#243139" stroke-width="9" fill="none" stroke-linecap="round"/>
       <circle cx="-15" cy="-200" r="5" fill="#243139"/><circle cx="15" cy="-200" r="5" fill="#243139"/>
       <g id="ear"><path d="M40 -200 q14 0 14 14" stroke="#FFF8EB" stroke-width="10" fill="none"/><circle cx="46" cy="-200" r="9" fill="#FFF8EB" stroke="#243139" stroke-width="3"/></g>
       <path id="babaArm" d="M30 -130 L90 -60" stroke="#7C9DA5" stroke-width="30" stroke-linecap="round"/>
     </g></g>
     <g id="ogul"><g class="body">
       <path d="M-34 0 L-30 -110 Q0 -130 30 -110 L34 0 Z" fill="#8A9B7C"/>
       <circle cy="-148" r="34" fill="#e9c9a6"/><path d="M-36 -160 Q0 -200 36 -160 Q20 -176 -36 -160Z" fill="#243139"/>
       <circle cx="-11" cy="-150" r="4" fill="#243139"/><circle cx="11" cy="-150" r="4" fill="#243139"/>
     </g></g>
     <g id="gal"><g class="body">
       <path d="M-48 0 L-42 -160 Q0 -186 42 -160 L48 0 Z" fill="#243139"/>
       <path d="M-8 -168 L8 -168 L12 -90 L0 -76 L-12 -90Z" fill="#ff5a1f"/>
       <circle cy="-206" r="44" fill="#e9c9a6"/><path d="M-44 -220 Q0 -262 44 -220 Q30 -240 -44 -220Z" fill="#1c1b18"/>
       <circle cx="-15" cy="-208" r="5" fill="#243139"/><circle cx="15" cy="-208" r="5" fill="#243139"/>
       <path id="galMouth" d="M-14 -186 Q0 -178 14 -186" stroke="#243139" stroke-width="5" fill="none" stroke-linecap="round"/>
       <g id="sweat"><path d="M48 -240 q10 18 0 26 q-10 -8 0 -26Z" fill="#7C9DA5"/><path d="M-54 -228 q10 18 0 26 q-10 -8 0 -26Z" fill="#7C9DA5"/><path d="M60 -196 q8 14 0 20 q-8 -6 0 -20Z" fill="#7C9DA5"/></g>
       <path id="galArm" d="M-30 -130 L-90 -60" stroke="#243139" stroke-width="30" stroke-linecap="round"/>
     </g></g>
     <!-- silence bubbles -->
     <g id="dots"><path d="M-110 -70 H110 Q130 -70 130 -50 V30 Q130 50 110 50 H-30 L-60 90 L-60 50 H-110 Q-130 50 -130 30 V-50 Q-130 -70 -110 -70Z" fill="#FFF8EB"/>
       <circle class="d" cx="-50" cy="-10" r="14" fill="#1c1b18"/><circle class="d" cx="0" cy="-10" r="14" fill="#1c1b18"/><circle class="d" cx="50" cy="-10" r="14" fill="#1c1b18"/></g>
     <g id="bub"><path d="M-250 -80 H250 Q270 -80 270 -60 V40 Q270 60 250 60 H80 L40 110 L40 60 H-250 Q-270 60 -270 40 V-60 Q-270 -80 -250 -80Z" fill="#FFF8EB"/>
       <text id="bubT" x="0" y="8" text-anchor="middle" font-family="Space Grotesk" font-weight="700" font-size="54" fill="#1c1b18"></text></g>
   </g>
   <!-- big earphone (close-up) -->
   <g id="bigEar"><path id="cable" d="M470 900 C470 1100 300 1150 330 1350" fill="none" stroke="#1c1b18" stroke-width="12" stroke-linecap="round"/>
     <g id="bud" transform="translate(470 860)" filter="url(#ps)"><ellipse rx="120" ry="90" fill="#FFF8EB"/><ellipse rx="54" ry="40" cx="-20" fill="#d9d3c4"/><rect x="60" y="-20" width="140" height="44" rx="22" fill="#FFF8EB"/></g></g>
  </svg>
  <!-- kinetic text inside receipt -->
  <div id="tA" class="abs gk" style="left:60px;right:60px;top:210px;font-size:64px;text-align:center"></div>
  <div id="num" class="abs gk" style="left:40px;right:40px;top:300px;font-size:150px;text-align:center"></div>
 </div>
 <!-- hook (outside receipt so it can fill the frame) -->
 <div id="hook" class="abs gk" style="left:110px;top:520px;width:860px;font-size:190px;line-height:.95">
  <div class="hw">Babam</div><div class="hw" style="font-size:128px">pazarlıkta</div><div class="hw o" style="font-size:240px">HİÇ</div><div class="hw" style="font-size:158px">konuşmaz.</div>
 </div>
</div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), p=(t,a,d)=>cl((t-a)/d);
const io=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, oc=x=>1-Math.pow(1-x,3), ic=x=>x*x*x;
const ob=x=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const L=(a,b,k)=>a+(b-a)*k;
const T=26.75, END=26.05;
const fmt=v=>String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const st=t=>Math.floor(t*12)/12; // stop-motion time for paper
function place(id,x,y,s=1,r=0,o=1){const g=$(id);g.setAttribute('transform',`translate(${x} ${y}) rotate(${r}) scale(${s})`);g.style.opacity=o}
function drawP(el,k){el.setAttribute('pathLength',1);el.style.strokeDasharray='1 1';el.style.strokeDashoffset=1-k;el.style.opacity=k>0?1:0}
function wob(t,a){return t<a?0:4*Math.exp(-(t-a)*6)*Math.sin((t-a)*18)}
window.seek=function(t){
  // ---------- camera: hook zoom, pull back, close-up on ear, push back to hook at the end
  let s=1.2,ty=0;
  const pull=io(p(t,1.95,.55)), push=io(p(t,END-.45,.45));
  s=L(1.2,1,pull); s=L(s,1.2,push);
  const ear=io(p(t,21.2,.5))*(1-io(p(t,24.9,.4)));
  s*=1+ear*.0;
  $('cam').style.transform=`scale(${s}) translate(0px,${ty}px)`;
  $('furn').style.opacity=pull*(1-push); $('prog').style.width=(cl(t/END)*100)+'%';
  // ---------- HOOK (frame 0 complete; motion from frame 0)
  const hk=$('hook'), hws=hk.querySelectorAll('.hw');
  const hookOn=t<2.6||t>=END-.45;
  hk.style.display=hookOn?'block':'none';
  hws.forEach((w,i)=>{let y=0,sc=1,o=1,ls=-3;
    if(t<2.6){y=-10*Math.sin(t*2.2)*(i%2?1:-1);const c=io(p(t,1.85+i*.05,.3));sc=1-c;o=1-c*.2}
    else{const k=oc(p(t,END-.45+i*.06,.35));y=(1-k)*80;o=cl(p(t,END-.45+i*.06,.1)*2)}
    w.style.transform=`translateY(${y}px) scaleY(${sc})`;w.style.transformOrigin='0 85%';w.style.opacity=o;w.style.letterSpacing=ls+'px'});
  hk.style.transform=`scale(${1-.04*Math.sin(t*.8)})`;
  // ---------- paper scene timing (stop-motion pieces)
  const ts=st(t);
  const sceneIn=ob(p(ts,2.0,.6)), sceneOut=io(p(t,18.3,.5));
  const scene=$('scene'); scene.style.display=(t>1.95&&t<21.4)?'block':'none';
  // camera on scene: shrink downward while chart is up (8.2–16)
  const chartUp=io(p(t,8.1,.5))*(1-io(p(t,15.9,.5)));
  scene.setAttribute('transform',`translate(${470-470*(1-.62*chartUp)} ${chartUp*430+ (1-sceneIn)*700}) scale(${1-.38*chartUp})`);
  $('banner').style.opacity=sceneIn*(1-chartUp);$('banner').setAttribute('transform','translate(0 110)');
  // car
  const carDrive=io(p(t,18.4,2.6));
  $('car').setAttribute('transform',`translate(${(1-oc(p(ts,2.0,.7)))*900 - carDrive*1300} ${0})`);
  document.querySelectorAll('.wh').forEach(w=>{const b=w.getAttribute('transform').split(')')[0]+')';w.setAttribute('transform',b+` rotate(${-carDrive*900})`)});
  // tag flips to price at galerici's line
  const fl=p(t,5.5,.4),sx=Math.cos(fl*Math.PI);
  $('tagIn').setAttribute('transform',`scale(${Math.abs(sx)} 1)`);
  $('tag').querySelector('text').textContent=sx<0?'1.200.000':'SATILIK';
  $('tag').querySelector('text').setAttribute('font-size',sx<0?24:30);
  // people
  const walk=t=>Math.sin(t*16)*4;
  const bx=L(-200,330,oc(p(ts,2.3,.8))), ox=L(-260,200,oc(p(ts,2.45,.8)));
  place('baba',bx,1290+ (p(ts,2.3,.8)<1?Math.abs(walk(ts)):0),1,wob(t,3.5));
  place('ogul',ox,1290,1,wob(t,3.7));
  const gx=L(1150,740,oc(p(ts,5.3,.7)));
  place('gal',gx,1290,1,wob(t,6.0),1);
  // sweat
  const sw=$('sweat'); sw.style.opacity=t>11.95&&t<16?1:0; sw.setAttribute('transform',`translate(0 ${((t*60)%30)})`);
  // galerici mouth: nervous wave during sweat
  $('galMouth').setAttribute('d',t>11.95&&t<15.7?`M-14 -184 q5 -6 9 0 q5 6 9 0 q5 -6 9 0`:`M-14 -186 Q0 -178 14 -186`);
  // handshake 15.97
  const hs=oc(p(t,15.97,.5));
  $('babaArm').setAttribute('d',`M30 -130 L${L(90,190,hs)} ${L(-60,-120,hs)}`);
  $('galArm').setAttribute('d',`M-30 -130 L${L(-90,-190,hs)} ${L(-60,-120,hs)}`);
  if(hs>0){place('gal',L(gx,560,hs),1290,1,wob(t,16.4))}
  // silence dots over baba (7.24 and 10.63)
  const d1=(t>7.2&&t<8.2)||(t>10.6&&t<11.75);
  const dk=t<9?p(t,7.2,.25):p(t,10.6,.25);
  $('dots').setAttribute('transform',`translate(${bx+20} ${1290-340}) scale(${d1?ob(dk)*(t>10?1.25:1):0})`);
  document.querySelectorAll('#dots .d').forEach((d,i)=>d.style.opacity=d1&&((t*3+i*.33)%1)<.7?1:.25);
  // speech bubble: "Baba, nasıl yaptın?" over ogul (19.93–21.2)
  const bOn=t>19.9&&t<21.3;
  $('bubT').textContent='Baba, nasıl yaptın?';
  $('bub').setAttribute('transform',`translate(470 760) scale(${bOn?ob(p(t,19.9,.35)):0})`);
  // scene leaves for close-up: the car drives off (paper slides), people stay then slide away at 21.2
  const offPeople=io(p(t,21.2,.4));
  if(t>18.3){const k=io(p(t,18.4,1.2));$('banner').style.opacity=1-k;}
  if(offPeople>0){$('scene').style.opacity=1-offPeople}else $('scene').style.opacity=1;
  // ---------- ink line chart (8.3–16): steps down at each new price
  const ch=$('chart'); const cOn=t>8.1&&t<16.4; ch.style.display=cOn?'block':'none';
  const cp=$('cl'); const segs=[[8.3,.6,.0,.36],[13.3,.8,.36,1]];
  let k=0; if(t>=8.3) k=L(0,.36,io(p(t,8.3,.9))); if(t>=13.3) k=L(.36,1,io(p(t,13.3,1.2)));
  drawP(cp,Math.max(k,.001)); cp.style.opacity=(t>8.1?1:0)*(1-io(p(t,15.9,.4)));
  const Lc=cp.getTotalLength(), P=cp.getPointAtLength(Lc*k); $('tip').setAttribute('cx',P.x);$('tip').setAttribute('cy',P.y);$('tip').style.opacity=cp.style.opacity;
  // ---------- kinetic text inside receipt
  const tA=$('tA'), num=$('num');
  let txt='',tStart=0, nTxt='', nStart=0, nCol='#1c1b18', nSize=150;
  const lines=[[2.5,5.35,'Geçen hafta <span class="o">araba</span> bakmaya gittik.'],[7.2,8.1,'Babam <span class="o">sustu.</span>'],
    [10.6,11.95,'Babam <span class="o">yine</span> sustu.'],[11.95,13.25,'Galerici <span class="o">terledi.</span>'],[13.3,15.9,'"Abi, aramızda kalsın."'],
    [15.97,18.3,'<span class="o">Anlaştılar.</span>'],[18.45,19.9,'Arabaya binince sordum:'],[25.0,END-.4,'İşte bu yüzden...']];
  for(const [a,b,x] of lines) if(t>=a&&t<b){txt=x;tStart=a}
  if(tA.dataset.t!==txt){tA.innerHTML=txt;tA.dataset.t=txt}
  const tk=ob(p(t,tStart,.4)); tA.style.opacity=txt?cl(p(t,tStart,.1)*2):0; tA.style.transform=`translateY(${(1-tk)*40}px)`;
  tA.style.top=(t>13.2&&t<16)?'230px':'210px';
  // numbers: roll
  let v=null;
  if(t>=5.45&&t<8.25) v=1200000;
  if(t>=8.25&&t<16){v=L(1200000,1150000,io(p(t,8.3,.7))); if(t>=13.3) v=L(1150000,1100000,io(p(t,13.3,.8)));}
  if(v!==null){num.textContent=fmt(v)+' ₺';num.style.opacity=1;const a=t<8.25?5.45:t<13.3?8.3:13.3;num.style.transform=`scale(${.8+.2*ob(p(t,a,.35))})`;
    num.style.color=t>=13.3?'#ff5a1f':'#1c1b18'; num.style.top=t>=8.1?'330px':'300px'; num.style.fontSize=t>=8.1?'130px':'150px'}
  else num.style.opacity=0;
  if(t>=5.45&&t<8.1){tA.innerHTML='Galerici:';tA.style.opacity=1;tA.style.transform='none'}
  if(t>=8.25&&t<10.6){tA.innerHTML='<span class="o">"Son fiyat."</span>';tA.style.opacity=1}
  // ---------- close-up: earphone out (21.37–24.9) — the cable is the ink line
  const be=$('bigEar'); const eOn=t>21.2&&t<25.05; be.style.display=eOn?'block':'none';
  const ek=ob(p(t,21.35,.5)), pull2=io(p(t,22.2,.8));
  $('bud').setAttribute('transform',`translate(${470+pull2*120} ${L(1400,860,ek)-pull2*80}) rotate(${-20*pull2})`);
  drawP($('cable'),io(p(t,21.5,.7))); $('cable').style.opacity=eOn?1-io(p(t,24.7,.3)):0;
  be.style.opacity=1-io(p(t,24.75,.3));
  // close-up text
  if(t>=21.37&&t<23.1){tA.innerHTML='Kulaklığı çıkardı:';tA.style.opacity=1}
  if(t>=23.1&&t<24.0){num.style.opacity=1;num.style.color='#1c1b18';num.style.fontSize='96px';num.style.top='360px';num.textContent='"Ne dedi adam?"';num.style.transform=`scale(${.85+.15*ob(p(t,23.1,.3))})`;tA.style.opacity=0}
  if(t>=24.0&&t<25.0){num.style.opacity=1;num.style.color='#ff5a1f';num.style.fontSize='150px';num.style.top='300px';num.innerHTML='DUYMADIM<br>Kİ.';num.style.transform=`scale(${.7+.3*ob(p(t,24.0,.3))}) rotate(-3deg)`;tA.style.opacity=0}
  // shake on slam
  const sh=[[5.45],[13.3],[24.0]].some(([a])=>t>a&&t<a+.25)?Math.sin(t*90)*6:0;
  $('rc').style.transform=`translateX(${sh}px)`;

};
</script></body></html>
